name: Test Notion Sync Daemon

on:
  pull_request:
    paths:
      - 'src/services/NotionSyncService.ts'
      - 'src/routes/notion-webhooks.ts'
      - 'scripts/notion-*.ts'
      - '.github/workflows/test-sync-daemon.yml'
  push:
    branches:
      - main
    paths:
      - 'src/services/NotionSyncService.ts'
      - 'src/routes/notion-webhooks.ts'
      - 'scripts/notion-*.ts'

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The repo-wide `tsc --noEmit` moved to ci.yml, which runs on every PR.
      # Keeping it here meant the only typecheck in the repo was gated behind
      # this workflow's Notion-specific paths filter.

      # `scripts/**/*.ts` is dropped: eslint.config.js ignores `scripts/**`, so
      # passing that glob made eslint exit 2 ("no matching configuration") every
      # run — which the trailing `|| true` then swallowed. The mask is removed
      # now that the command can actually succeed or fail on merit.
      - name: Lint sync daemon code
        run: npx eslint "src/services/**/*.ts" "src/routes/**/*.ts"

  validate-dependencies:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for Notion SDK
        run: npm ls @notionhq/client

      - name: Check for Express
        run: npm ls express

      - name: Check for Winston
        run: npm ls winston

      - name: Verify all imports resolve
        run: |
          node -e "require('./src/services/NotionSyncService')" 2>/dev/null || echo "NotionSyncService imports OK (TypeScript)"
          node -e "require('./src/routes/notion-webhooks')" 2>/dev/null || echo "notion-webhooks imports OK (TypeScript)"

  test-configuration:
    name: Test Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # PM2 step removed: ecosystem.config.js has never existed in this repo and
      # the service deploys to Cloudflare Workers, not a PM2-managed process.
      # The step failed on every run of this workflow.

      - name: Check .env.example completeness
        run: |
          required_vars=(
            "NOTION_TOKEN"
            "NOTION_PARENT_PAGE_ID"
            "NOTION_WEBHOOK_SECRET"
            "CHITTYREGISTRY_NOTION_DB_ID"
            "CHITTYSCHEMA_NOTION_DB_ID"
            "CHITTYGOV_NOTION_DB_ID"
            "CHITTYCHRONICLE_NOTION_DB_ID"
            "CHITTY_ID_TOKEN"
          )

          for var in "${required_vars[@]}"; do
            if grep -q "^${var}=" .env.example; then
              echo "✓ ${var} found in .env.example"
            else
              echo "✗ ${var} missing from .env.example"
              exit 1
            fi
          done

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Check for hardcoded secrets
        run: |
          # Notion integration tokens are `secret_` + ~43 base62 chars. The old
          # pattern was `secret_[a-zA-Z0-9]`, which matched the placeholder in
          # scripts/connect-existing-notion-db.ts ("NOTION_TOKEN=secret_xxxxx")
          # and failed this job on every run. Require realistic length, and
          # ignore obvious placeholders.
          if grep -rE "secret_[a-zA-Z0-9]{32,}" src/ scripts/ --exclude-dir=node_modules \
               | grep -vE "x{5,}|X{5,}|\.\.\."; then
            echo "⚠️ Potential hardcoded Notion token found"
            exit 1
          fi

          # Check for ChittyID tokens
          if grep -r "mcp_auth_[a-zA-Z0-9]" src/ scripts/ --exclude-dir=node_modules; then
            echo "⚠️ Potential hardcoded ChittyID token found"
            exit 1
          fi

          echo "✓ No hardcoded secrets detected"

  integration-test:
    name: Integration Test (Mock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create mock .env
        run: |
          cat > .env << EOF
          NOTION_TOKEN=secret_mock_token_for_testing
          NOTION_PARENT_PAGE_ID=00000000-0000-0000-0000-000000000000
          NOTION_WEBHOOK_SECRET=mock-webhook-secret
          CHITTY_ID_TOKEN=mock_chitty_token
          CHITTYREGISTRY_NOTION_DB_ID=00000000-0000-0000-0000-000000000001
          CHITTYSCHEMA_NOTION_DB_ID=00000000-0000-0000-0000-000000000002
          CHITTYGOV_NOTION_DB_ID=00000000-0000-0000-0000-000000000003
          CHITTYCHRONICLE_NOTION_DB_ID=00000000-0000-0000-0000-000000000004
          REGISTRY_SERVICE=https://registry.chitty.cc
          SCHEMA_SERVICE=https://schema.chitty.cc
          GOV_SERVICE=https://gov.chitty.cc
          SYNC_DAEMON_PORT=3456
          NODE_ENV=test
          EOF

      - name: Test migration script (dry run)
        run: |
          # This previously ran `npx ts-node -e "console.log('...')"`, which
          # evaluates a string literal and never looked at the migration script
          # at all — it reported success regardless. Typecheck the real files.
          # --ignoreConfig: the root tsconfig only includes src/**, and passing
          # files explicitly alongside it is an error (TS5112).
          npx tsc --noEmit --ignoreConfig \
            scripts/notion-migration.ts scripts/notion-sync-daemon.ts \
            --esModuleInterop --skipLibCheck --target ES2022 --module commonjs \
            --moduleResolution bundler --types node
          echo "✓ Migration scripts are valid TypeScript"

      - name: Test sync daemon script (syntax check)
        run: |
          # Was `npx ts-node -e "console.log('...')"` — same vacuous pattern as
          # the migration step: it evaluated a literal and never read the file.
          npx tsc --noEmit --ignoreConfig scripts/notion-sync-daemon.ts \
            --esModuleInterop --skipLibCheck --target ES2022 --module commonjs \
            --moduleResolution bundler --types node
          echo "✓ Sync daemon script is valid TypeScript"

  documentation-check:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check required documentation exists
        run: |
          # DEPLOYMENT.md, NOTION-SYNC.md, NOTION-QUICKSTART.md and
          # NOTION-INTEGRATION-SUMMARY.md were listed here but have never
          # existed in this repo, so this job failed on every run. Requiring
          # docs nobody has written is a wish, not a check — narrowed to the
          # two that exist. Add them back alongside the documents themselves.
          required_docs=(
            "CLAUDE.md"
            "README.md"
          )

          for doc in "${required_docs[@]}"; do
            if [ -f "$doc" ]; then
              echo "✓ $doc exists"
            else
              echo "✗ $doc missing"
              exit 1
            fi
          done

      # "Verify deployment instructions" removed alongside the PM2 config check.
      # It grepped DEPLOYMENT.md — a file that has never existed — for "PM2",
      # a process manager this service does not use; it deploys to Cloudflare
      # Workers. Restore it with a DEPLOYMENT.md that describes the real
      # deployment path, if one is written.

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, validate-dependencies, test-configuration, security-check, integration-test, documentation-check]
    if: always()
    steps:
      - name: Report test results
        run: |
          echo "### Notion Sync Daemon Test Results"
          echo ""
          echo "✅ All validation checks passed"
          echo ""
          echo "**Note**: Sync daemon deployment requires manual VPS setup."
          echo "See DEPLOYMENT.md for complete deployment instructions."
