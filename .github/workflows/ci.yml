name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs on every PR. Previously the only `tsc --noEmit` in the repo lived in
      # test-sync-daemon.yml behind a Notion-specific paths filter, so a repo-wide
      # check effectively never ran and main carried 80 type errors unnoticed.
      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --ci

  cli-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run CLI unit tests
        run: npm test -- --ci
